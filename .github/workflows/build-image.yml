name: Build and Push Music Service Docker Image

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "pom.xml"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/build-image.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  GCP_PROJECT_ID: project-a733d9b6-3591-4ac1-b42
  GCP_REGION: asia-southeast1
  GAR_REPOSITORY: music-service
  IMAGE_NAME: music-service

jobs:
  build-and-push:
    name: Build and push image to Artifact Registry
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker authentication
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build and push Docker image
        run: |
          IMAGE_URI="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GAR_REPOSITORY}/${IMAGE_NAME}"
          docker build --pull -t "${IMAGE_URI}:${GITHUB_SHA}" -t "${IMAGE_URI}:latest" .
          docker push "${IMAGE_URI}:${GITHUB_SHA}"
          docker push "${IMAGE_URI}:latest"
          echo "IMAGE_URI=${IMAGE_URI}" >> "$GITHUB_ENV"

      - name: Show published image
        run: |
          echo "Published image: ${IMAGE_URI}:${GITHUB_SHA}"
          echo "Latest tag: ${IMAGE_URI}:latest"
