name: Build and Push Music Service Image to Docker Hub

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "pom.xml"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/build-image.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  DOCKERHUB_IMAGE: panha123456765432/music-service

jobs:
  build-and-push:
    name: Build and push Docker Hub image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.DOCKERHUB_IMAGE }}:latest
            ${{ env.DOCKERHUB_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Show published image
        run: |
          echo "Published image: ${DOCKERHUB_IMAGE}:latest"
          echo "Commit image: ${DOCKERHUB_IMAGE}:${GITHUB_SHA}"
