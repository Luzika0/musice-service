spring:
  application:
    name: music-service

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/music}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  servlet:
    multipart:
      max-file-size: 295MB
      max-request-size: 300MB

server:
  port: ${PORT:8081}

cloudflare:
  r2:
    account-id: ${CLOUD_FLARE_R2_ACC_ID}
    bucket: ${R2_BUCKET:music}
    access-key-id: ${ACCESS_KEY}
    secret-access-key: ${SECRET_KEY}

playback:
  expiration: ${PLAYBACK_EXPIRATION:300}

hls:
  ffmpeg-path: ${FFMPEG:ffmpeg}
